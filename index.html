<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questrade ACB Processor</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f9f9f9; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        header, footer, #acb-app { text-align: center; width: 100%; max-width: 450px; }
        h1 { margin-bottom: 0; color: #222; font-size: 28px; }
        .subtitle { margin-top: 5px; margin-bottom: 25px; color: #666; font-style: italic; }

        #acb-app { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            border: 1px solid #eee; 
            box-sizing: border-box;
        }

        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #555; text-align: left; }
        input, select { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        .btn { 
            width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; 
            font-weight: bold; font-size: 15px; transition: opacity 0.2s; display: flex; 
            align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box; 
        }
        #login-btn { background: #4CAF50; color: white; margin-bottom: 20px; }
        #submit-btn { background: #007bff; color: white; margin-top: 15px; position: relative; }
        #submit-btn:disabled { background: #66b0ff; cursor: not-allowed; }
        
        /* Spinner Styles */
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            display: none; /* Hidden by default */
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Main container for results */
        #results-container { 
            margin-top: 20px; 
            background: #fdfdfd; 
            border: 1px solid #e0e0e0; 
            border-radius: 12px; 
            padding: 20px; 
            display: none; 
            text-align: left; 
            max-width: 100%; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        /* Container for the HTML returned by Vercel */
        #output-box { 
            margin: 0; 
            font-family: inherit; /* Use the clean system font instead of monospace */
            font-size: 14px; 
            color: #444; 
            line-height: 1.6;
            white-space: normal; /* Allow the HTML divs to stack naturally */
        }

        /* Styles for the <h2> tag from your Python code */
        .report-header {
            display: block;
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            border-bottom: 2px solid #007bff;
            margin-bottom: 15px;
            padding-bottom: 8px;
        }

        /* Styles for each <div class="report-content"> line */
        .report-content {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            word-break: break-word; /* Safe wrapping for mobile */
        }

        /* Remove border from the last item */
        .report-content:last-of-type {
            border-bottom: none;
        }

footer { 
    margin-top: 30px; 
    padding-bottom: 20px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 12px; 
    font-size: 14px; 
    color: #777; 
}
.footer-logo { 
    width: 80px; 
    height: 80px; 
    object-fit: contain; /* Prevents oblong stretching */
    display: block; 
    border-radius: 8px; 
}
@media (max-width: 480px) { 
    .footer-logo { width: 60px; height: 60px; } 
}

    </style>
</head>
<body>

<header>
    <h1>kwessACBweb</h1>
    <div class="subtitle">a Questrade ACB processor</div>
</header>

<div id="acb-app">
    <a id="login-btn" class="btn" href="#">1. Connect to Questrade</a>

    <label>Access Token:</label>
    <input type="text" id="token" placeholder="Automatically fills after login" readonly>
    <input type="hidden" id="api_server">

    <label>Account Type:</label>
    <select id="acc_type">
        <option value="Margin" selected>Margin</option>
        <option value="TFSA">TFSA</option>
        <option value="RRSP">RRSP</option>
        <option value="Cash">Cash</option>
        <option value="RESP">RESP</option>
        <option value="FHSA">FHSA</option>
        <option value="LIRA">LIRA</option>
    </select>

    <label>Start Date:</label>
    <input type="date" id="start_date" value="2001-06-01">
    
    <label style="display: flex; align-items: center; margin-bottom: 15px; font-size: 14px; cursor: pointer;">
        <input type="checkbox" id="include_fees" checked style="width: auto; margin: 0 10px 0 0;"> Include commission fees?
    </label>

    <label>Email:</label>
    <input type="email" id="email" style="margin-bottom: 15px;">    
    
    <button id="submit-btn" class="btn">
        <span class="spinner" id="btn-spinner"></span>
        <span id="btn-text">2. Process ACB Results</span>
    </button>

    <div id="results-container">
        <div id="output-box"></div>
    </div>
</div>

<footer>
    <span>Brought to you by: </span>
    <a href="https://soloist.ai/kaiyoux" target="_blank" style="display: inline-block;">
        <!-- The browser will now find 'logo.png' in your GitHub repo folder -->
        <img src="logo.png" alt="Logo" class="footer-logo">
    </a>
</footer>

<script>
(function() {
    const myClientId = 'DEIpf9J-u9SoMcO2DI4IZDyKAO0gwg';
    // IMPORTANT: Update this URL once your GitHub site is live!
    const myRedirect = 'https://kaiyoux.github.io/kwess_acb/';

    // 1. HANDLE LOGIN
    document.getElementById('login-btn').onclick = function(e) {
        e.preventDefault();
        const authUrl = "https://login.questrade.com/oauth2/authorize?client_id=" + myClientId + "&response_type=token" + "&redirect_uri=" + encodeURIComponent(myRedirect);
        window.location.href = authUrl;
    };

    // 2. CAPTURE DATA FROM REDIRECT
    function checkHash() {
        const hash = window.location.hash.substring(1);
        if (hash.includes('access_token=')) {
            const params = new URLSearchParams(hash);
            document.getElementById('token').value = params.get('access_token');
            document.getElementById('api_server').value = params.get('api_server');
            document.getElementById('token').style.background = "#e8f5e9";
            document.getElementById('results-container').style.display = "block";
            document.getElementById('output-box').innerText = "✅ Questrade Connected!";
            
            // Remove token from address bar for security
            window.history.replaceState(null, null, window.location.pathname);
        }
    }
    checkHash();

    // 3. SUBMIT TO BACKEND
    document.getElementById('submit-btn').onclick = async function() {
        const btn = this;
        const spinner = document.getElementById('btn-spinner');
        const btnText = document.getElementById('btn-text');
        const out = document.getElementById('output-box');
        const token = document.getElementById('token').value;

        if (!token) return alert("Please connect to Questrade first.");

        // UI Loading State
        btn.disabled = true;
        spinner.style.display = "block";
        btnText.innerText = "Processing...";
        document.getElementById('results-container').style.display = "block";
        out.innerText = "Processing transactions...";

        try {
            const res = await fetch('https://kwess-acb-web.vercel.app/process_acb', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: token,
                    api_server: document.getElementById('api_server').value,
                    acc_type: document.getElementById('acc_type').value,
                    start_date: document.getElementById('start_date').value || "2001-06-01",
                    include_fees: document.getElementById('include_fees').checked ? "TRUE" : "FALSE",
                    email: document.getElementById('email').value
                })
            });
            const data = await res.json();
	    if (data.status === "success") {
		// This renders the <h2> and <div> tags from your web_results
		out.innerHTML = data.output; 
	    } else {
		out.innerText = "❌ " + data.message;
	    }
        } finally {
            // Restore UI State
            btn.disabled = false;
            spinner.style.display = "none";
            btnText.innerText = "2. Process ACB Results";
        }
    };
})();
</script>

</body>
</html>
